<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ナンプレ読み取りソルバ</title>
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1f2328; --sub: #5f6670; --line: #d7d4cc; --thick: #3b3f46;
  --accent: #d9480f; --given: #1f2328; --sel: #ffe8a3; --warn: #b42318; --ok: #1a7f37; --btn: #1f6feb;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15171a; --card: #1e2126; --ink: #e8eaed; --sub: #9aa0a6; --line: #3a3e45; --thick: #c9ccd1;
          --accent: #ff8a4c; --given: #e8eaed; --sel: #5a4a12; --warn: #ff6b5e; --ok: #4cc26a; --btn: #4c8dff; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
h1 { font-size: 1.35rem; margin: 8px 0 4px; }
p.lead { margin: 0 0 16px; color: var(--sub); font-size: .92rem; line-height: 1.6; }
label.pick { display: block; text-align: center; background: var(--btn); color: #fff; font-weight: 700;
             padding: 16px; border-radius: 12px; font-size: 1.1rem; cursor: pointer; }
label.pick input { display: none; }
#status { margin: 14px 2px; min-height: 1.5em; font-weight: 600; line-height: 1.5; }
#status.ok { color: var(--ok); } #status.warn { color: var(--warn); }
.card { background: var(--card); border-radius: 12px; padding: 12px; margin-top: 12px; }
.card h2 { font-size: .95rem; margin: 0 0 8px; color: var(--sub); font-weight: 600; }
canvas#view { width: 100%; height: auto; display: block; border-radius: 6px; }
table#grid { border-collapse: collapse; width: 100%; table-layout: fixed; user-select: none; }
#grid td { border: 1px solid var(--line); text-align: center; vertical-align: middle; height: 0;
           padding: 0; font-size: clamp(16px, 5.6vw, 28px); cursor: pointer; }
#grid td div { aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; }
#grid tr:nth-child(3n+1) td { border-top: 2px solid var(--thick); }
#grid tr:last-child td { border-bottom: 2px solid var(--thick); }
#grid td:nth-child(3n+1) { border-left: 2px solid var(--thick); }
#grid td:last-child { border-right: 2px solid var(--thick); }
#grid td.given { color: var(--given); font-weight: 700; }
#grid td.ans { color: var(--accent); }
#grid td.unsure div { text-decoration: underline wavy var(--warn); }
#grid td.sel { background: var(--sel); }
#pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
#pad button { font-size: 1.15rem; padding: 10px 0; border-radius: 8px; border: 1px solid var(--line);
              background: var(--card); color: var(--ink); }
#pad button:disabled { opacity: .35; }
.note { color: var(--sub); font-size: .82rem; line-height: 1.6; margin-top: 8px; }
.hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>ナンプレ読み取りソルバ</h1>
  <p class="lead">解けないナンプレの画面をスクリーンショットして選ぶと、盤を読み取って答えを出します。
    画像はこの端末の中だけで処理し、どこにも送りません。</p>

  <label class="pick">スクショを選ぶ<input id="file" type="file" accept="image/*"></label>
  <div id="status"></div>

  <div id="out" class="hidden">
    <div class="card">
      <h2>答え（元の画面に重ねて表示）</h2>
      <canvas id="view"></canvas>
    </div>
    <div class="card">
      <h2>読み取った盤 — 黒が読んだ数字、色つきが答え。読み違いはマスをタップして直せます</h2>
      <table id="grid"></table>
      <div id="pad"></div>
      <div class="note">波線のついた数字は読み取りの自信が低いものです。</div>
    </div>
  </div>
</main>
<script>
const worker = new Worker('worker.js');
const $ = id => document.getElementById(id);
let img = null, given = [], sol = [], conf = [], xs = [], ys = [], sel = -1;

function status(text, cls) { const s = $('status'); s.textContent = text; s.className = cls || ''; }

$('file').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  status('画像を読み込み中…');
  try {
    img = await createImageBitmap(f);
  } catch (err) {
    const url = URL.createObjectURL(f);
    img = await new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = url; });
  }
  // 大きすぎる写真は長辺 3000px に縮める（スクショはそのまま）
  const sc = Math.min(1, 3000 / Math.max(img.width, img.height));
  const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
  img = c;
  const rgba = ctx.getImageData(0, 0, w, h).data;
  status('盤を探して数字を読んでいます…（数秒かかります）');
  worker.postMessage({ type: 'recognize', rgba, w, h }, [rgba.buffer]);
  e.target.value = '';
});

worker.onmessage = e => {
  const d = e.data;
  if (d.type === 'recognized') {
    given = d.board; conf = d.conf; xs = d.xs; ys = d.ys; sel = -1;
  } else {
    given = d.board;
  }
  sol = d.n > 0 ? d.sol : [];
  const cnt = given.filter(v => v).length;
  const t = d.ms ? `（${(d.ms / 1000).toFixed(1)} 秒）` : '';
  if (d.n === 1) status(`解けました。数字 ${cnt} 個を読み取り、答えは 1 通りです${t}`, 'ok');
  else if (d.n >= 2) status(`答えが 1 通りに決まりません（数字 ${cnt} 個）。読み落としがあるかもしれません。下の盤で確認してください${t}`, 'warn');
  else status(`この盤には答えがありません（数字 ${cnt} 個）。読み違いがあるはずです。下の盤で直してください${t}`, 'warn');
  $('out').classList.remove('hidden');
  drawView(); drawGrid();
};

function drawView() {
  const pw = (xs[9] - xs[0]) / 9, ph = (ys[9] - ys[0]) / 9;
  const pad = Math.round(Math.min(pw, ph) * 0.3);
  const x0 = Math.max(0, Math.floor(xs[0] - pad)), y0 = Math.max(0, Math.floor(ys[0] - pad));
  const x1 = Math.min(img.width, Math.ceil(xs[9] + pad)), y1 = Math.min(img.height, Math.ceil(ys[9] + pad));
  const v = $('view'); v.width = x1 - x0; v.height = y1 - y0;
  const ctx = v.getContext('2d');
  ctx.drawImage(img, x0, y0, v.width, v.height, 0, 0, v.width, v.height);
  if (!sol.length) return;
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#d9480f';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < 81; i++) {
    if (given[i]) continue;
    const r = Math.floor(i / 9), c = i % 9;
    const cx = (xs[c] + xs[c + 1]) / 2 - x0, cy = (ys[r] + ys[r + 1]) / 2 - y0;
    const fs = Math.min(xs[c + 1] - xs[c], ys[r + 1] - ys[r]) * 0.62;
    ctx.font = `700 ${fs}px -apple-system, "Hiragino Sans", "Segoe UI", sans-serif`;
    ctx.lineWidth = fs * 0.14; ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.strokeText(String(sol[i]), cx, cy + fs * 0.04);
    ctx.fillStyle = '#e8590c';
    ctx.fillText(String(sol[i]), cx, cy + fs * 0.04);
  }
}

function drawGrid() {
  const t = $('grid'); t.innerHTML = '';
  for (let r = 0; r < 9; r++) {
    const tr = document.createElement('tr');
    for (let c = 0; c < 9; c++) {
      const i = r * 9 + c, td = document.createElement('td'), dv = document.createElement('div');
      if (given[i]) { dv.textContent = given[i]; td.className = 'given' + (conf[i] > 0 && conf[i] < 0.8 ? ' unsure' : ''); }
      else if (sol.length) { dv.textContent = sol[i]; td.className = 'ans'; }
      if (i === sel) td.classList.add('sel');
      td.appendChild(dv);
      td.onclick = () => { sel = i === sel ? -1 : i; drawGrid(); };
      tr.appendChild(td);
    }
    t.appendChild(tr);
  }
  const pad = $('pad'); pad.innerHTML = '';
  for (const v of [1, 2, 3, 4, 5, 6, 7, 8, 9, 0]) {
    const b = document.createElement('button');
    b.textContent = v ? v : '消す';
    b.disabled = sel < 0;
    b.onclick = () => {
      if (sel < 0) return;
      const nb = given.slice(); nb[sel] = v; conf[sel] = 1;
      sel = -1;
      worker.postMessage({ type: 'solve', board: nb });
    };
    pad.appendChild(b);
  }
}
</script>
</body>
</html>
